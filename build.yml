              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
          }
          EOF_6
          mkdir -p MusicLock
          cat > MusicLock/gradle.properties <<'EOF_7'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_7
          mkdir -p MusicLock/module
          cat > MusicLock/module/customize.sh <<'EOF_8'
          #!/system/bin/sh
          SKIPUNZIP=0
          [ -f "$MODPATH/musiclock.apk" ] || abort "! 模块内缺少 musiclock.apk"
          ui_print "- 安装 MusicLock App"
          pm install -r "$MODPATH/musiclock.apk" >/dev/null 2>&1 \
            && ui_print "- 安装成功" \
            || ui_print "! 现在安装失败，重启后会由 service.sh 再试一次"
          EOF_8
          mkdir -p MusicLock/module
          cat > MusicLock/module/module.prop <<'EOF_9'
          id=musiclock
          name=MusicLock 锁屏封面
          version=v1.0
          versionCode=1
          author=you
          description=Apple Music 播放时，锁屏显示 iPhone 风格虚化封面 + 滚动歌词（配套 App 自动安装并授权）
          EOF_9
          mkdir -p MusicLock/module
          cat > MusicLock/module/service.sh <<'EOF_10'
          #!/system/bin/sh
          MODDIR=${0%/*}
          PKG=com.musiclock
          until [ "$(getprop sys.boot_completed)" = "1" ]; do sleep 3; done
          sleep 10
          pm path $PKG >/dev/null 2>&1 || pm install -r "$MODDIR/musiclock.apk"
          pm grant $PKG android.permission.POST_NOTIFICATIONS 2>/dev/null
          appops set $PKG USE_FULL_SCREEN_INTENT allow
          appops set $PKG SYSTEM_ALERT_WINDOW allow
          appops set $PKG RUN_IN_BACKGROUND allow
          appops set $PKG RUN_ANY_IN_BACKGROUND allow
          cmd notification allow_listener $PKG/com.musiclock.MediaListener
          dumpsys deviceidle whitelist +$PKG >/dev/null 2>&1
          EOF_10
          mkdir -p MusicLock/module
          cat > MusicLock/module/uninstall.sh <<'EOF_11'
          #!/system/bin/sh
          cmd notification disallow_listener com.musiclock/com.musiclock.MediaListener
          pm uninstall com.musiclock
          EOF_11
          mkdir -p MusicLock
          cat > MusicLock/settings.gradle.kts <<'EOF_12'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MusicLock"
          include(":app")
          EOF_12
      - name: Build APK
        run: |
          cd MusicLock
          gradle assembleDebug --no-daemon
      - name: Package module
        run: |
          cp MusicLock/app/build/outputs/apk/debug/app-debug.apk MusicLock/module/musiclock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MusicLock-module
          path: MusicLock/module/*
